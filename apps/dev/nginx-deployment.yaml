# Con esto se crea el ns , si no habria que crearlo previamente
# a mano . Ejem; kubectl create namespace dev-ngnix
apiVersion: v1
kind: Namespace
metadata:
  name: dev-ngnix
# 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: dev-ngnix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80